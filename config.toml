# ─────────────────────────────────────────────
#  GitHub 主页唯一数据源
#  改这里 → push → Actions 读配置重生成 README.md 和 banner
#  （config.toml 自己不显示在页面上，它只是原料）
# ─────────────────────────────────────────────

[profile]
name         = "starry"                # banner 大字
real_name    = "Hongyu Wang"
github       = "wanghongyu666qiang"
school       = "海南大学"
school_en    = "Hainan University"     # banner 里用英文，和等宽字体才搭
location     = "海口"
location_en  = "Haikou"
headline     = "把想法写成能跑的东西"
asset_version = "4"                    # 改了 banner / 蛇图后 +1，否则 GitHub 图片缓存会装死

[contact]
email     = "why17573315302@gmail.com"
blog      = "https://starrylovetbao.cloud"
blog_name = "starrylovetbao.cloud"

# 社交平台填了才会出现
[contact.social]
# zhihu  = "https://www.zhihu.com/people/xxx"
# juejin = "https://juejin.cn/user/xxx"

[about]
# 一段话，不写成清单。清单看起来像简历模板。
text = "海大在读。喜欢 C++ 的确定性，也喜欢 Python 的随意。写代码和写字差不多——都是把想不清楚的事，慢慢写清楚。"

[tech]
mono       = true        # 纸墨单色徽章；改 false 回到各语言的品牌色
languages  = ["C++", "Python", "TypeScript", "Rust"]
frameworks = ["Vue.js", "Next.js"]
web        = ["HTML5", "CSS3", "WebAssembly"]
tools      = ["Git", "Linux", "Docker", "VSCode"]

# ─── 项目 ───────────────────────────────────
# stars / lang 是兜底值；Actions 里会用 GitHub API 拉真实数据
