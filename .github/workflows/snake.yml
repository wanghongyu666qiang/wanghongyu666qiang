name: Generate Snake

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0 点 (= 北京时间 8 点)
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark&color_dots=%23eb6f92,%23f0883e,%23f6c177,%23e0af68,%239ccfd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Strip snk decorative bar
        run: |
          # snk 会在底部生成一条 class="u uN" 的装饰性动画横条，属于杂讯，去掉
          python - <<'PY'
          import re, pathlib
          for f in pathlib.Path("output").glob("github-contribution-grid-snake*.svg"):
              s = f.read_text(encoding="utf-8")
              cleaned = re.sub(r'<rect class="u u\d+"[^>]*/>', '', s)
              if cleaned != s:
                  f.write_text(cleaned, encoding="utf-8")
                  print(f"cleaned {f}")
          PY

      - name: Commit snake
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "🐍 auto: update contribution snake"
          git push
